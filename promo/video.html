<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Healthy Battery promo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #F3F5F7; }
  body { font-family: 'Inter', sans-serif; color: #111316; -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #F3F5F7; }

  .blob { position: absolute; border-radius: 50%; filter: blur(120px); opacity: .55; will-change: transform; }
  #blobA { width: 900px; height: 900px; background: #BFEBDD; }
  #blobB { width: 800px; height: 800px; background: #D7E4F6; }
  #blobC { width: 600px; height: 600px; background: #F6E7C8; opacity: .35; }

  .scene { position: absolute; inset: 0; opacity: 0; will-change: opacity, transform, filter; }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

  .col-text { position: absolute; left: 150px; top: 0; bottom: 0; width: 660px; display: flex; flex-direction: column; justify-content: center; }
  .visual { position: absolute; left: 860px; top: 0; width: 960px; height: 1080px; }
  .kicker { font: 600 22px 'Inter'; letter-spacing: .16em; text-transform: uppercase; color: #1F8F79; }
  .title { font: 700 76px/1.04 'Inter Display', 'Inter'; letter-spacing: -.025em; margin-top: 22px; }
  .sub { font: 400 29px/1.42 'Inter'; color: #5B616A; margin-top: 28px; max-width: 620px; }
  .rv { will-change: opacity, transform; }

  .card { position: absolute; background: rgba(255,255,255,.78); border: 1px solid rgba(255,255,255,.95);
          border-radius: 40px; box-shadow: 0 40px 90px rgba(25,35,45,.13), 0 2px 8px rgba(0,0,0,.05); }
  .panel { background: #E5E5E7; border: 1px solid rgba(255,255,255,.7); }

  /* scene 1 */
  .big-line { font: 700 84px/1.06 'Inter Display', 'Inter'; letter-spacing: -.03em; max-width: 1500px; }
  .big-line.soft { color: #6A7078; font-weight: 600; font-size: 54px; margin-top: 26px; }
  .cap-label { font: 500 26px 'Inter'; color: #6A7078; letter-spacing: .02em; }
  .cap-value { font: 700 120px 'Inter Display'; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }

  /* panel pieces */
  .pill { position: absolute; height: 76px; border-radius: 38px; background: rgba(255,255,255,.45);
          display: flex; align-items: center; padding: 0 28px; font: 600 30px 'Inter'; color: #3A3D42; gap: 12px; }
  .circle-btn { position: absolute; width: 76px; height: 76px; border-radius: 50%; background: rgba(255,255,255,.45);
                display: flex; align-items: center; justify-content: center; }
  .bar { position: absolute; height: 66px; border-radius: 33px; background: #D1D1D4; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.06); }
  .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 33px;
              background: linear-gradient(#8DD987, #63BD61); box-shadow: inset 0 2px 0 rgba(255,255,255,.35); }
  .bar-label { position: absolute; left: 26px; top: 0; height: 66px; display: flex; align-items: center; font: 700 28px 'Inter'; color: #fff; font-variant-numeric: tabular-nums; }
  .bar-marker { position: absolute; top: 0; bottom: 0; width: 0; border-left: 3px dashed rgba(255,255,255,.95); }
  .status { position: absolute; font: 600 25px 'Inter'; color: #4A4D52; }

  /* flow */
  .node { position: absolute; width: 150px; height: 136px; border-radius: 30px;
          background: linear-gradient(160deg, #FFFFFF, #ECECEE); border: 1px solid rgba(255,255,255,.95);
          box-shadow: 0 14px 30px rgba(0,0,0,.10); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .node .n-name { font: 600 21px 'Inter'; color: #1A1C1F; margin-top: 4px; }
  .node .n-w { font: 500 20px 'Inter'; color: #7A7F86; font-variant-numeric: tabular-nums; }

  /* health */
  .stat-row { display: flex; justify-content: space-between; font: 400 23px 'Inter'; color: #4A4F56; padding: 7px 0; }
  .stat-row b { font-weight: 600; color: #15171A; font-variant-numeric: tabular-nums; }
  .stat-h { font: 600 24px 'Inter'; margin-bottom: 6px; }

  /* heat */
  .hrow { display: flex; justify-content: space-between; align-items: center; padding: 22px 0; border-bottom: 1px solid rgba(0,0,0,.07); font: 500 27px 'Inter'; color: #4A4F56; }
  .hrow:last-child { border-bottom: 0; }
  .hval { font: 700 30px 'Inter'; color: #15171A; font-variant-numeric: tabular-nums; }
  .chip { padding: 8px 20px; border-radius: 22px; font: 600 24px 'Inter'; }

  /* grid */
  .tile { position: absolute; width: 300px; height: 256px; border-radius: 34px; background: rgba(255,255,255,.8);
          border: 1px solid #fff; box-shadow: 0 24px 50px rgba(25,35,45,.10); padding: 30px; }
  .tile .t-ico { width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center; }
  .tile .t-name { font: 700 28px 'Inter Display'; margin-top: 22px; letter-spacing: -.01em; }
  .tile .t-desc { font: 400 20px/1.35 'Inter'; color: #636871; margin-top: 8px; }
  .tag { position: absolute; top: 30px; right: 26px; font: 600 14px 'Inter'; letter-spacing: .08em; text-transform: uppercase; color: #A06A00; background: #FCEFD2; padding: 6px 10px; border-radius: 10px; }

  /* trust */
  .word { font: 800 116px/1.08 'Inter Display'; letter-spacing: -.035em; }
  .badge { display: inline-flex; align-items: center; gap: 12px; padding: 16px 28px; border-radius: 40px; background: rgba(255,255,255,.85);
           border: 1px solid #fff; box-shadow: 0 10px 30px rgba(0,0,0,.07); font: 600 26px 'Inter'; color: #2A2D31; margin: 0 10px; }

  /* cta */
  .term { width: 1420px; border-radius: 26px; background: #15171B; box-shadow: 0 40px 90px rgba(0,0,0,.25); overflow: hidden; text-align: left; }
  .term-top { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 22px; background: #1F2227; }
  .dot { width: 15px; height: 15px; border-radius: 50%; }
  .term-body { padding: 34px 40px 40px; font: 500 29px 'DejaVu Sans Mono', monospace; color: #E8EAED; white-space: pre; }
  .caret { display: inline-block; width: 16px; height: 34px; background: #6FDDBB; vertical-align: -6px; margin-left: 4px; }
  .url { font: 600 40px 'Inter'; color: #1F8F79; margin-top: 46px; letter-spacing: -.01em; }
  .wordmark { font: 800 128px 'Inter Display'; letter-spacing: -.04em; }
  .tagline { font: 500 40px/1.3 'Inter'; color: #5B616A; margin-top: 18px; }

  .cursor { position: absolute; width: 44px; height: 44px; pointer-events: none; z-index: 20; }
</style>
</head>
<body>
<div id="stage">
  <div class="blob" id="blobA"></div>
  <div class="blob" id="blobB"></div>
  <div class="blob" id="blobC"></div>

  <!-- 1. Hook -->
  <section class="scene" id="s1">
    <div class="center">
      <div id="s1bat" style="position:relative;width:520px;height:250px;margin-bottom:60px">
        <svg width="520" height="250" viewBox="0 0 520 250">
          <rect x="6" y="6" width="468" height="238" rx="64" fill="none" stroke="#2A2D33" stroke-width="12"/>
          <rect x="484" y="80" width="30" height="90" rx="14" fill="#2A2D33"/>
          <clipPath id="s1clip"><rect x="26" y="26" width="428" height="198" rx="46"/></clipPath>
          <rect id="s1fill" x="26" y="26" width="0" height="198" fill="#63BD61" clip-path="url(#s1clip)"/>
        </svg>
        <div id="s1pct" style="position:absolute;left:0;top:0;width:480px;height:250px;display:flex;align-items:center;justify-content:center;font:800 92px 'Inter Display';color:#fff;letter-spacing:-.03em;font-variant-numeric:tabular-nums">0%</div>
        <div id="s1heat" style="position:absolute;inset:-60px;border-radius:120px;background:radial-gradient(closest-side,rgba(255,110,60,.45),rgba(255,110,60,0));z-index:-1;opacity:0"></div>
      </div>
      <div class="big-line rv" id="s1a" data-k="s1a"></div>
      <div class="big-line soft rv" id="s1b" data-k="s1b"></div>
      <div class="rv" id="s1cap" style="margin-top:44px;display:flex;align-items:baseline;gap:22px">
        <span class="cap-label" data-k="cap"></span>
        <span class="cap-value" id="s1capv" style="font-size:64px"></span>
      </div>
    </div>
  </section>

  <!-- 2. Logo -->
  <section class="scene" id="s2">
    <div class="center">
      <div id="s2icon" style="width:300px;height:300px;border-radius:68px;background:linear-gradient(#F9FAFC,#E0E4E9);box-shadow:0 40px 80px rgba(20,40,50,.18),inset 0 1px 0 #fff;display:flex;align-items:center;justify-content:center">
        <svg id="s2svg" width="250" height="250" viewBox="0 0 1024 1024"></svg>
      </div>
      <div class="wordmark rv" id="s2word" style="margin-top:56px">Healthy Battery</div>
      <div class="tagline rv" id="s2tag" data-k="tag"></div>
    </div>
  </section>

  <!-- 3. Charge limit -->
  <section class="scene" id="s3">
    <div class="col-text">
      <div class="kicker rv" data-k="s3k"></div>
      <div class="title rv" data-k="s3t"></div>
      <div class="sub rv" data-k="s3s"></div>
    </div>
    <div class="visual">
      <div class="card panel" id="s3panel" style="left:60px;top:330px;width:840px;height:420px">
        <div class="pill" style="left:40px;top:40px"><span data-k="limitword"></span><span id="s3limit" style="font-variant-numeric:tabular-nums">100%</span></div>
        <div class="circle-btn" style="left:500px;top:40px"><svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="#8A8E94" stroke-width="2.6"/><path d="M10 17h14" stroke="#8A8E94" stroke-width="2.6" stroke-linecap="round"/></svg></div>
        <div class="pill" id="s3topup" style="left:592px;top:40px;padding:0 24px"><span data-k="topup"></span><svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M10 17h14M17 10v14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></div>
        <div class="bar" style="left:40px;top:160px;width:760px">
          <div class="bar-fill" id="s3fill" style="width:50%"></div>
          <div class="bar-label" id="s3pct">50%</div>
          <div id="s3pause" style="position:absolute;top:19px;width:20px;height:28px;opacity:0"><div style="position:absolute;left:0;width:7px;height:28px;border-radius:2px;background:#fff"></div><div style="position:absolute;right:0;width:7px;height:28px;border-radius:2px;background:#fff"></div></div>
          <div class="bar-marker" id="s3marker"></div>
        </div>
        <div style="position:absolute;left:40px;right:40px;top:272px;height:2px;background:rgba(0,0,0,.08)"></div>
        <div class="status" id="s3status" style="left:40px;top:310px"></div>
        <div id="s3dot" style="position:absolute;right:44px;top:316px;width:16px;height:16px;border-radius:50%;background:#34C759"></div>
      </div>
      <svg class="cursor" id="s3cursor" viewBox="0 0 24 24"><path d="M4 2l15 11.2-6.6 1 3.9 7.3-2.7 1.4-3.9-7.4L4 20.4z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </div>
  </section>

  <!-- 4. Power flow -->
  <section class="scene" id="s4">
    <div class="col-text">
      <div class="kicker rv" data-k="s4k"></div>
      <div class="title rv" data-k="s4t"></div>
      <div class="sub rv" data-k="s4s"></div>
    </div>
    <div class="visual">
      <div class="card panel" id="s4panel" style="left:20px;top:250px;width:920px;height:600px">
        <div class="status" style="left:44px;top:42px;font-size:26px" data-k="onadapter"></div>
        <div id="s4flow" style="position:absolute;left:30px;top:90px;width:860px;height:480px">
          <svg id="s4svg" width="860" height="480" viewBox="0 0 860 480" style="position:absolute;left:0;top:0"></svg>
        </div>
      </div>
    </div>
  </section>

  <!-- 5. Long-term health -->
  <section class="scene" id="s5">
    <div class="col-text">
      <div class="kicker rv" data-k="s5k"></div>
      <div class="title rv" data-k="s5t"></div>
      <div class="sub rv" data-k="s5s"></div>
    </div>
    <div class="visual">
      <div class="card" id="s5card" style="left:30px;top:200px;width:900px;height:680px;padding:40px 46px">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <div style="font:700 32px 'Inter Display'" data-k="lth"></div>
          <div style="font:500 22px 'Inter';color:#7A7F86" id="s5days"></div>
        </div>
        <svg id="s5svg" width="808" height="300" viewBox="0 0 808 300" style="margin-top:26px;display:block"></svg>
        <div style="display:flex;gap:60px;margin-top:26px">
          <div style="flex:1" id="s5colA"></div>
          <div style="flex:1" id="s5colB"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 6. Heat protection -->
  <section class="scene" id="s6">
    <div class="col-text">
      <div class="kicker rv" data-k="s6k" style="color:#C2410C"></div>
      <div class="title rv" data-k="s6t"></div>
      <div class="sub rv" data-k="s6s"></div>
    </div>
    <div class="visual">
      <div id="s6therm" style="position:absolute;left:20px;top:240px;width:200px;height:600px">
        <svg width="200" height="600" viewBox="0 0 200 600">
          <rect x="50" y="10" width="60" height="470" rx="30" fill="#fff" stroke="#D5D8DD" stroke-width="4"/>
          <circle cx="80" cy="520" r="62" fill="#fff" stroke="#D5D8DD" stroke-width="4"/>
          <rect id="s6merc" x="64" y="200" width="32" height="320" rx="16" fill="#F97316"/>
          <circle id="s6bulb" cx="80" cy="520" r="46" fill="#F97316"/>
          <g id="s6ticks"></g>
        </svg>
      </div>
      <div class="card" id="s6card" style="left:260px;top:280px;width:660px;height:auto;padding:24px 44px 18px">
        <div class="hrow"><span data-k="temp"></span><span class="hval" id="s6temp">31.0 °C</span></div>
        <div class="hrow"><span data-k="climit"></span><span class="hval" id="s6limit">90%</span></div>
        <div class="hrow"><span>Turbo</span><span class="chip" id="s6turbo">On</span></div>
      </div>
      <div id="s6banner" style="position:absolute;left:260px;top:640px;width:660px;height:96px;border-radius:30px;display:flex;align-items:center;gap:18px;padding:0 34px;font:600 28px 'Inter'"></div>
    </div>
  </section>

  <!-- 7. Automation grid -->
  <section class="scene" id="s7">
    <div style="position:absolute;left:0;right:0;top:120px;text-align:center">
      <div class="kicker rv" data-k="s7k"></div>
      <div class="title rv" data-k="s7t" style="font-size:80px"></div>
    </div>
    <div id="s7grid" style="position:absolute;left:0;right:0;top:370px;height:600px"></div>
  </section>

  <!-- 8. Trust -->
  <section class="scene" id="s8">
    <div class="center">
      <div id="s8words"></div>
      <div id="s8badges" style="margin-top:70px;display:flex;justify-content:center"></div>
    </div>
  </section>

  <!-- 9. CTA -->
  <section class="scene" id="s9">
    <div class="center">
      <div style="display:flex;align-items:center;gap:40px" class="rv" id="s9head">
        <div style="width:150px;height:150px;border-radius:36px;background:linear-gradient(#F9FAFC,#E0E4E9);box-shadow:0 20px 40px rgba(20,40,50,.16);display:flex;align-items:center;justify-content:center">
          <svg id="s9svg" width="124" height="124" viewBox="0 0 1024 1024"></svg>
        </div>
        <div class="wordmark" style="font-size:104px">Healthy Battery</div>
      </div>
      <div class="term rv" id="s9term" style="margin-top:70px">
        <div class="term-top"><div class="dot" style="background:#FF5F57"></div><div class="dot" style="background:#FEBC2E"></div><div class="dot" style="background:#28C840"></div></div>
        <div class="term-body"><span style="color:#6FDDBB">$ </span><span id="s9cmd"></span><span class="caret" id="s9caret"></span></div>
      </div>
      <div class="url rv" id="s9url">github.com/berkinefeavci/healthy-battery</div>
      <div class="rv" id="s9foot" style="font:500 26px 'Inter';color:#7A7F86;margin-top:18px" data-k="foot"></div>
    </div>
  </section>
</div>

  s6(t, el) {
    revealAll(el, t);
    const pp = eOut(prog(t, .3, 1.1));
    ['s6therm', 's6card'].forEach((id, i) => { const e = $(id); const q = eOut(prog(t, .3 + i * .15, 1.1 + i * .15)); e.style.opacity = q; e.style.transform = `translateY(${(1 - q) * 60}px)`; });
    // temperature curve
    let temp;
    if (t < 1.2) temp = 31;
    else if (t < 3.6) temp = lerp(31, 36.2, eInOut(prog(t, 1.2, 3.6)));
    else if (t < 4.6) temp = 36.2 - .15 * Math.sin((t - 3.6) * 3);
    else temp = lerp(36.1, 31.4, eInOut(prog(t, 4.6, 6.8)));
    const rising = t < 4.6;
    const active = rising ? temp >= 35 : temp >= 32;
    const restored = !rising && temp < 32;
    const hot = clamp((temp - 30) / 6);
    const col = hot < .5 ? mix('3B82F6', 'F59E0B', hot * 2) : mix('F59E0B', 'DC2626', (hot - .5) * 2);
    const top = tY(temp);
    $('s6merc').setAttribute('y', top); $('s6merc').setAttribute('height', 520 - top);
    $('s6merc').setAttribute('fill', col); $('s6bulb').setAttribute('fill', col);
    $('s6temp').textContent = num(temp, 1) + ' °C';
    $('s6temp').style.color = active ? '#DC2626' : '#15171A';
    $('s6limit').innerHTML = active ? `<span style="color:#9AA0A7;text-decoration:line-through;font-weight:500">${pct(90)}</span>&nbsp; ${pct(80)}` : pct(90);
    const tb = $('s6turbo');
    tb.textContent = active ? S.off : S.on;
    tb.style.background = active ? '#ECEDEF' : '#DDF3E4'; tb.style.color = active ? '#6A7078' : '#1B7A3A';
    const bn = $('s6banner');
    const bp = eOut(prog(t, 1.0, 1.6)); bn.style.opacity = bp; bn.style.transform = `translateY(${(1 - bp) * 30}px)`;
    const shield = c => `<svg width="34" height="34" viewBox="0 0 26 26"><path d="M13 2l9 4v6c0 6-4 10-9 12-5-2-9-6-9-12V6z" fill="${c}"/><path d="M8.5 13l3 3 6-6" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    if (active) { bn.style.background = '#FDE7DC'; bn.style.color = '#B4380C'; bn.innerHTML = shield('#EA580C') + S.hp_on; }
    else if (restored) { bn.style.background = '#DDF3E4'; bn.style.color = '#1B7A3A'; bn.innerHTML = shield('#22A045') + S.hp_off; }
    else { bn.style.background = 'rgba(255,255,255,.75)'; bn.style.color = '#4A4F56'; bn.innerHTML = shield('#9AA0A7') + S.hp_idle; }
    $('s6card').style.boxShadow = active ? `0 40px 90px rgba(220,60,20,${.14 + .06 * Math.sin(t * 6)}), 0 2px 8px rgba(0,0,0,.05)` : '';
  },
  s7(t, el) {
    el.querySelectorAll(':scope > div > .rv').forEach((e, i) => reveal(e, t, .15 + i * .16));
    for (let i = 0; i < 6; i++) {
      const p = prog(t, .7 + i * .14, 1.35 + i * .14);
      const e = $('tile' + i);
      e.style.opacity = eOut(p);
      e.style.transform = `translateY(${(1 - eOut(p)) * 70}px) scale(${lerp(.85, 1, eBack(p))})`;
    }
    // gentle float
    for (let i = 0; i < 6; i++) $('tile' + i).style.translate = `0 ${Math.sin(t * 1.4 + i) * 5}px`;
  },
  s8(t) {
    for (let i = 0; i < 4; i++) {
      const p = prog(t, .2 + i * .55, .75 + i * .55);
      const e = $('w8_' + i);
      e.style.opacity = eOut(p);
      e.style.transform = `translateY(${(1 - eOut(p)) * 50}px)`;
      e.style.filter = `blur(${(1 - eOut(p)) * 12}px)`;
    }
    for (let i = 0; i < 3; i++) {
      const p = prog(t, 2.6 + i * .2, 3.2 + i * .2);
      const e = $('b8_' + i);
      e.style.opacity = eOut(p); e.style.transform = `translateY(${(1 - eOut(p)) * 30}px) scale(${lerp(.9, 1, eBack(p))})`;
    }
  },
  s9(t) {
    reveal($('s9head'), t, .15, 40);
    reveal($('s9term'), t, .5, 40);
    const cmd = 'brew install --cask berkinefeavci/healthy-battery/healthy-battery';
    const n = Math.round(cmd.length * prog(t, 1.2, 3.6));
    $('s9cmd').textContent = cmd.slice(0, n);
    $('s9caret').style.opacity = (n < cmd.length || Math.floor(t * 2.2) % 2 === 0) ? 1 : 0;
    reveal($('s9url'), t, 3.8, 24);
    reveal($('s9foot'), t, 4.1, 20);
    const liq = document.querySelector('#s9svg .liq');
    liq.setAttribute('transform', `translate(${Math.sin(t * 2.2) * 14} ${lerp(200, 0, eOut(prog(t, .3, 1.6)))})`);
  }
};

window.renderFrame = function (t) {
  // background drift
  $('blobA').style.transform = `translate(${-200 + 160 * Math.sin(t * .23)}px, ${-260 + 120 * Math.cos(t * .19)}px)`;
  $('blobB').style.transform = `translate(${1250 + 140 * Math.cos(t * .21)}px, ${420 + 150 * Math.sin(t * .17)}px)`;
  $('blobC').style.transform = `translate(${700 + 260 * Math.sin(t * .15 + 1)}px, ${640 + 90 * Math.cos(t * .25)}px)`;
  for (const sc of SCENES) {
    const el = $(sc.id);
    if (t < sc.a - .01 || t > sc.b + .01) { el.style.opacity = 0; el.style.display = 'none'; continue; }
    el.style.display = 'block';
    const fin = sc.a === 0 ? 1 : eOut(prog(t, sc.a, sc.a + .5));
    const fout = sc.b >= window.DURATION ? 1 : 1 - eInOut(prog(t, sc.b - .5, sc.b));
    el.style.opacity = Math.min(fin, fout);
    const outP = 1 - fout;
    el.style.transform = `scale(${1 - outP * .04})`;
    el.style.filter = outP > 0 ? `blur(${outP * 10}px)` : 'none';
    UPD[sc.id](t - sc.a, el);
  }
};
// final fade to background
window.renderFrame(0);
window.READY = document.fonts.ready.then(() => true);

// live preview when opened in a browser normally
if (!new URLSearchParams(location.search).has('render')) {
  const t0 = performance.now();
  (function loop() { renderFrame(((performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(loop); })();
}
</script>
</body>
